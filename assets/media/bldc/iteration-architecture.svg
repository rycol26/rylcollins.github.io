<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="28" fill="#091619"/><g font-family="Arial,Helvetica,sans-serif"><text x="70" y="72" fill="#edf3f1" font-size="38" font-weight="700">Why axial flux made iteration easier</text><text x="70" y="112" fill="#aebfbd" font-size="21">Treat the motor like stacked layers: keep interfaces stable, then revise one layer without resetting the entire assembly.</text><text x="70" y="190" fill="#8bc7d2" font-size="15" font-weight="700" letter-spacing="2">LAYERED MOTOR STACK</text><g transform="translate(95 235)"><rect x="0" y="0" width="210" height="260" rx="20" fill="#102429" stroke="#315159" stroke-width="2"/><circle cx="105" cy="105" r="66" fill="#15373c" stroke="#82c7c0" stroke-width="4"/><circle cx="105" cy="105" r="23" fill="#091619"/><text x="105" y="205" text-anchor="middle" fill="#edf3f1" font-size="23" font-weight="700">Rotor</text><text x="105" y="232" text-anchor="middle" fill="#b9c8c5" font-size="16">magnet geometry</text></g><g transform="translate(340 270)"><rect x="0" y="0" width="145" height="190" rx="20" fill="#102429" stroke="#8bc7d2" stroke-width="2"/><path d="M35 40 H110 M35 70 H110 M35 100 H110 M35 130 H110" stroke="#8bc7d2" stroke-width="3"/><text x="72" y="163" text-anchor="middle" fill="#edf3f1" font-size="21" font-weight="700">Air gap</text></g><g transform="translate(520 235)"><rect x="0" y="0" width="260" height="260" rx="20" fill="#102429" stroke="#315159" stroke-width="2"/><g fill="none" stroke="#82c7c0" stroke-width="7"><circle cx="82" cy="92" r="36"/><circle cx="178" cy="92" r="36"/><circle cx="82" cy="164" r="36"/><circle cx="178" cy="164" r="36"/></g><text x="130" y="220" text-anchor="middle" fill="#edf3f1" font-size="23" font-weight="700">Stator / coils</text><text x="130" y="246" text-anchor="middle" fill="#b9c8c5" font-size="16">winding + spacing</text></g><g transform="translate(815 235)"><rect x="0" y="0" width="225" height="260" rx="20" fill="#102429" stroke="#315159" stroke-width="2"/><path d="M55 155 L112 52 L170 155 Z" fill="#15373c" stroke="#c8a46c" stroke-width="4"/><text x="112" y="205" text-anchor="middle" fill="#edf3f1" font-size="23" font-weight="700">Structure</text><text x="112" y="232" text-anchor="middle" fill="#c8a46c" font-size="16">thermal limit found</text></g><g transform="translate(1075 235)"><rect x="0" y="0" width="225" height="260" rx="20" fill="#102429" stroke="#315159" stroke-width="2"/><path d="M55 115 H170 M85 75 L140 155 M140 75 L85 155" stroke="#8bc7d2" stroke-width="7"/><text x="112" y="205" text-anchor="middle" fill="#edf3f1" font-size="23" font-weight="700">Load</text><text x="112" y="232" text-anchor="middle" fill="#b9c8c5" font-size="16">geared scissors</text></g><g stroke="#557780" stroke-width="4" fill="#557780"><path d="M305 365 H340"/><polygon points="340,365 324,356 324,374"/><path d="M485 365 H520"/><polygon points="520,365 504,356 504,374"/><path d="M780 365 H815"/><polygon points="815,365 799,356 799,374"/><path d="M1040 365 H1075"/><polygon points="1075,365 1059,356 1059,374"/></g><text x="70" y="575" fill="#8bc7d2" font-size="15" font-weight="700" letter-spacing="2">ITERATION LOOP</text><rect x="70" y="610" width="1260" height="125" rx="20" fill="#102429" stroke="#315159"/><text x="145" y="663" fill="#edf3f1" font-size="22" font-weight="700">1. Hold interfaces</text><text x="435" y="663" fill="#edf3f1" font-size="22" font-weight="700">2. Change one layer</text><text x="760" y="663" fill="#edf3f1" font-size="22" font-weight="700">3. Reassemble fast</text><text x="1065" y="663" fill="#edf3f1" font-size="22" font-weight="700">4. Load test</text><text x="145" y="700" fill="#b9c8c5" font-size="16">mounting + air gap</text><text x="435" y="700" fill="#b9c8c5" font-size="16">coils / rotor / structure</text><text x="760" y="700" fill="#b9c8c5" font-size="16">avoid full redesign</text><text x="1065" y="700" fill="#b9c8c5" font-size="16">failure becomes input</text></g></svg>