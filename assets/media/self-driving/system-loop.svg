<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760"><rect width="1440" height="760" fill="#091619"/><g font-family="Arial,Helvetica,sans-serif"><text x="68" y="62" fill="#edf3f1" font-size="34" font-weight="700">Camera-to-steering validation loop</text><text x="68" y="101" fill="#9fb6b5" font-size="18">Model metrics were used to select a candidate; the physical track remained the final validation gate.</text><rect x="68" y="220" width="245" height="135" fill="#102429" stroke="#315159" stroke-width="2"/><text x="92" y="260" fill="#edf3f1" font-size="20" font-weight="700">Camera frame</text><text x="92" y="298" fill="#b9c8c5" font-size="16">physical track input</text><path d="M313 287 H405" stroke="#557780" stroke-width="3"/><polygon points="405,287 389,278 389,296" fill="#557780"/><rect x="405" y="220" width="245" height="135" fill="#102429" stroke="#315159" stroke-width="2"/><text x="429" y="260" fill="#edf3f1" font-size="20" font-weight="700">Candidate networks</text><text x="429" y="298" fill="#b9c8c5" font-size="16">compare model performance</text><path d="M650 287 H742" stroke="#557780" stroke-width="3"/><polygon points="742,287 726,278 726,296" fill="#557780"/><rect x="742" y="220" width="245" height="135" fill="#102429" stroke="#82c7c0" stroke-width="2"/><text x="766" y="260" fill="#edf3f1" font-size="20" font-weight="700">Selected model</text><text x="766" y="298" fill="#82c7c0" font-size="17">R² 97.03% · MSE 9.9</text><path d="M987 287 H1079" stroke="#557780" stroke-width="3"/><polygon points="1079,287 1063,278 1063,296" fill="#557780"/><rect x="1079" y="220" width="293" height="135" fill="#102429" stroke="#315159" stroke-width="2"/><text x="1103" y="260" fill="#edf3f1" font-size="20" font-weight="700">Physical car</text><text x="1103" y="298" fill="#b9c8c5" font-size="16">steering + vehicle motion</text><path d="M1225 355 V445 H190 V355" fill="none" stroke="#557780" stroke-width="3" stroke-dasharray="9 8"/><polygon points="190,355 181,371 199,371" fill="#557780"/><text x="706" y="475" text-anchor="middle" fill="#9fb6b5" font-size="16">vehicle motion changes the next camera frame</text><text x="68" y="585" fill="#8bc7d2" font-size="13" font-weight="700" letter-spacing="2">FINAL VALIDATION</text><line x1="68" y1="610" x2="1372" y2="610" stroke="#315159" stroke-width="2"/><text x="68" y="655" fill="#edf3f1" font-size="18">The numerical metrics were not treated as the final result: the completed Raspberry Pi car successfully followed the curved track.</text></g></svg>