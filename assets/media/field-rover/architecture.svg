<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820"><defs><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#82c7c0"/><stop offset="1" stop-color="#8bc7d2"/></linearGradient></defs><rect width="1400" height="820" rx="28" fill="#091619"/><g font-family="Arial,Helvetica,sans-serif"><text x="70" y="72" fill="#edf3f1" font-size="38" font-weight="700">Field rover: evidence before autonomy</text><text x="70" y="112" fill="#aebfbd" font-size="21">The current cart validates sensing, observability, safety, and data quality before propulsion is allowed to complicate the system.</text><rect x="70" y="175" width="1260" height="120" rx="22" fill="#102429" stroke="#315159"/><text x="110" y="215" fill="#8bc7d2" font-size="15" font-weight="700" letter-spacing="2">FIELD INPUTS</text><text x="110" y="258" fill="#edf3f1" font-size="21">RGB cameras</text><text x="335" y="258" fill="#edf3f1" font-size="21">2D LiDAR</text><text x="530" y="258" fill="#edf3f1" font-size="21">GNSS</text><text x="690" y="258" fill="#edf3f1" font-size="21">IMU</text><text x="840" y="258" fill="#edf3f1" font-size="21">network</text><text x="1040" y="258" fill="#edf3f1" font-size="21">operator observations</text><path d="M700 295 V350" stroke="#557780" stroke-width="5"/><polygon points="700,350 690,330 710,330" fill="#557780"/><rect x="310" y="350" width="780" height="210" rx="28" fill="url(#core)"/><text x="700" y="405" text-anchor="middle" fill="#071315" font-size="16" font-weight="700" letter-spacing="2">ONBOARD COMPUTE</text><text x="700" y="455" text-anchor="middle" fill="#071315" font-size="32" font-weight="800">Linux services on Raspberry Pi</text><text x="700" y="500" text-anchor="middle" fill="#0b2528" font-size="20">capture · health checks · stable device mapping · diagnostics</text><text x="700" y="533" text-anchor="middle" fill="#0b2528" font-size="20">remote access · structured logging</text><path d="M510 560 V625" stroke="#82c7c0" stroke-width="5"/><polygon points=