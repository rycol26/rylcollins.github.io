<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820"><rect width="1400" height="820" rx="28" fill="#091619"/><g font-family="Arial,Helvetica,sans-serif"><text x="70" y="72" fill="#edf3f1" font-size="38" font-weight="700">Machine-learning steering: metric to motion</text><text x="70" y="112" fill="#aebfbd" font-size="21">The useful test was not just model fit. The selected network had to close the loop on the physical car.</text><rect x="72" y="190" width="265" height="190" rx="22" fill="#102429" stroke="#315159"/><text x="104" y="230" fill="#8bc7d2" font-size="15" font-weight="700" letter-spacing="2">1 · OBSERVE</text><rect x="112" y="260" width="185" height="72" rx="10" fill="#15373c"/><path d="M128 313 C160 268 210 345 280 276" fill="none" stroke="#82c7c0" stroke-width="8"/><text x="205" y="360" text-anchor="middle" fill="#edf3f1" font-size="20">camera frame</text><path d="M337 285 H405" stroke="#557780" stroke-width="4"/><polygon points="405,285 388,275 388,295" fill="#557780"/><rect x="405" y="190" width="265" height="190" rx="22" fill="#102429" stroke="#315159"/><text x="437" y="230" fill="#8bc7d2" font-size="15" font-weight="700" letter-spacing="2">2 · PREDICT</text><text x="537" y="286" text-anchor="middle" fill="#edf3f1" font-size="24" font-weight="700">neural network</text><text x="537" y="323" text-anchor="middle" fill="#b9c8c5" font-size="18">steering estimate</text><path d="M670 285 H738" stroke="#557780" stroke-width="4"/><polygon points="738,285 721,275 721,295" fill="#557780"/><rect x="738" y="190" width="265" height="190" rx="22" fill="#102429" stroke="#315159"/><text x="770" y="230" fill="#8bc7d2" font-size="15" font-weight="700" letter-spacing="2">3 · ACT</text><path d="M793 317 H948 M825 280 L916 345 M916 280 L825 345" stroke="#82c7c0" stroke-width="7"/><text x="870" y="360" text-anchor="middle" fill="#edf3f1" font-size="20">steering + motion</text><path d="M1003 285 H1071" stroke="#557780" stroke-width="4"/><polygon points="1071,285 1054,275 1054,295" fill="#557780"/><rect x="1071" y="190" width="257" height="190" rx="22" fill="#102429" stroke="#315159"/><text x="1103" y="230" fill="#8bc7d2" font-size="15" font-weight="700" letter-spacing="2">4 · VERIFY</text><path d="M1110 315 C1155 250 1230 355 1290 278" fill="none" stroke="#c8a46c" stroke-width="8"/><text x="1199" y="360" text-anchor="middle" fill="#edf3f1" font-size="20">physical track</text><path d="M1199 380 C1199 475 205 475 205 380" fill="none" stroke="#315159" stroke-width="4" stroke-dasharray="10 10"/><text x="700" y="470" text-anchor="middle" fill="#9fb6b5" font-size="17">next frame closes the loop</text><text x="70" y="555" fill="#8bc7d2" font-size="15" font-weight="700" letter-spacing="2">MODEL SELECTION + PHYSICAL EVIDENCE</text><rect x="70" y="590" width="390" height="130" rx="20" fill="#102429" stroke="#315159"/><text x="100" y="632" fill="#b9c8c5" font-size="16">MODEL FIT</text><text x="100" y="682" fill="#edf3f1" font-size="36" font-weight="800">R² 97.03%</text><rect x="505" y="590" width="390" height="130" rx="20" fill="#102429" stroke="#315159"/><text x="535" y="632" fill="#b9c8c5" font-size="16">MEAN SQUARED ERROR</text><text x="535" y="682" fill="#edf3f1" font-size="36" font-weight="800">9.9</text><rect x="940" y="590" width="390" height="130" rx="20" fill="#102429" stroke="#315159"/><text x="970" y="632" fill="#b9c8c5" font-size="16">HARDWARE TEST</text><text x="970" y="672" fill="#edf3f1" font-size="27" font-weight="800">followed the curved track</text></g></svg>