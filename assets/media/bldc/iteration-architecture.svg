<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760"><rect width="1440" height="760" fill="#091619"/><g font-family="Arial,Helvetica,sans-serif"><text x="68" y="62" fill="#edf3f1" font-size="34" font-weight="700">Axial-flux motor — layered design logic</text><text x="68" y="101" fill="#9fb6b5" font-size="18">The axial arrangement allowed rotor, air gap, winding, and structure to be revised as distinct interfaces.</text><text x="68" y="170" fill="#8bc7d2" font-size="13" font-weight="700" letter-spacing="2">SIDE-VIEW STACK</text><rect x="110" y="240" width="120" height="260" fill="#102429" stroke="#82c7c0" stroke-width="3"/><text x="170" y="540" text-anchor="middle" fill="#edf3f1" font-size="18" font-weight="700">Rotor</text><text x="170" y="570" text-anchor="middle" fill="#9fb6b5" font-size="15">magnets</text><rect x="320" y="270" width="60" height="200" fill="none" stroke="#8bc7d2" stroke-width="3" stroke-dasharray="8 7"/><text x="350" y="540" text-anchor="middle" fill="#edf3f1" font-size="18" font-weight="700">Air gap</text><rect x="470" y="240" width="180" height="260" fill="#102429" stroke="#315159" stroke-width="3"/><g fill="none" stroke="#82c7c0" stroke-width="7"><circle cx="525" cy="320" r="30"/><circle cx="595" cy="320" r="30"/><circle cx="525" cy="405" r="30"/><circle cx="595" cy="405" r="30"/></g><text x="560" y="540" text-anchor="middle" fill="#edf3f1" font-size="18" font-weight="700">Stator / coils</text><text x="560" y="570" text-anchor="middle" fill="#9fb6b5" font-size="15">6-coil wye winding</text><rect x="755" y="240" width="180" height="260" fill="#102429" stroke="#c8a46c" stroke-width="3"/><text x="845" y="350" text-anchor="middle" fill="#edf3f1" font-size="18" font-weight="700">Printed</text><text x="845" y="380" text-anchor="middle" fill="#edf3f1" font-size="18" font-weight="700">structure</text><text x="845" y="540" text-anchor="middle" fill="#c8a46c" font-size="16">thermal limit found</text><rect x="1040" y="240" width="290" height="260" fill="#102429" stroke="#315159" stroke-width="3"/><text x="1185" y="340" text-anchor="middle" fill="#edf3f1" font-size="19" font-weight="700">Mechanical load</text><text x="1185" y="380" text-anchor="middle" fill="#b9c8c5" font-size="16">geared scissor mechanism</text><text x="1185" y="420" text-anchor="middle" fill="#b9c8c5" font-size="16">used as the real validation target</text><path d="M230 370 H320 M380 370 H470 M650 370 H755 M935 370 H1040" stroke="#557780" stroke-width="3"/><text x="68" y="650" fill="#8bc7d2" font-size="13" font-weight="700" letter-spacing="2">V1 RESULT</text><text x="68" y="690" fill="#edf3f1" font-size="18">The motor drove the mechanism; load testing then exposed PLA thermal deformation and rotor-stability limits for the next structural revision.</text></g></svg>