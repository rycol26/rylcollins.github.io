<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760"><rect width="1440" height="760" fill="#091619"/><g font-family="Arial,Helvetica,sans-serif"><text x="68" y="62" fill="#edf3f1" font-size="34" font-weight="700">Field-platform validation architecture</text><text x="68" y="101" fill="#9fb6b5" font-size="18">Sensing, diagnostics, and data quality are validated before powered mobility is introduced.</text><text x="68" y="170" fill="#8bc7d2" font-size="13" font-weight="700" letter-spacing="2">FIELD INPUTS</text><rect x="68" y="195" width="230" height="95" fill="#102429" stroke="#315159" stroke-width="2"/><text x="92" y="234" fill="#edf3f1" font-size="19" font-weight="700">RGB cameras</text><text x="92" y="264" fill="#b9c8c5" font-size="15">image evidence</text><rect x="326" y="195" width="230" height="95" fill="#102429" stroke="#315159" stroke-width="2"/><text x="350" y="234" fill="#edf3f1" font-size="19" font-weight="700">2D LiDAR</text><text x="350" y="264" fill="#b9c8c5" font-size="15">range / obstacle data</text><rect x="584" y="195" width="230" height="95" fill="#102429" stroke="#315159" stroke-width="2"/><text x="608" y="234" fill="#edf3f1" font-size="19" font-weight="700">GNSS + IMU</text><text x="608" y="264" fill="#b9c8c5" font-size="15">position / motion context</text><path d="M183 290 V350 M441 290 V350 M699 290 V350 M183 350 H699 M441 350 V390" stroke="#557780" stroke-width="3"/><polygon points="441,390 432,374 450,374" fill="#557780"/><rect x="294" y="390" width="515" height="145" fill="#102429" stroke="#82c7c0" stroke-width="2"/><text x="322" y="430" fill="#edf3f1" font-size="22" font-weight="700">Raspberry Pi / Linux services</text><text x="322" y="468" fill="#b9c8c5" font-size="16">capture · stable device mapping · health checks</text><text x="322" y="498" fill="#b9c8c5" font-size="16">diagnostics · remote access · structured logging</text><path d="M809 462 H905" stroke="#557780" stroke-width="3"/><polygon points="905,462 889,453 889,471" fill="#557780"/><rect x="905" y="390" width="467" height="145" fill="#102429" stroke="#315159" stroke-width="2"/><text x="933" y="430" fill="#edf3f1" font-size="22" font-weight="700">Reusable field evidence</text><text x="933" y="468" fill="#b9c8c5" font-size="16">raw imagery · timing · location</text><text x="933" y="498" fill="#b9c8c5" font-size="16">sensor/session context · diagnostics</text><text x="68" y="625" fill="#c8a46c" font-size="13" font-weight="700" letter-spacing="2">POWERED-MOBILITY GATE</text><line x1="68" y1="650" x2="1372" y2="650" stroke="#c8a46c" stroke-width="2"/><text x="68" y="690" fill="#edf3f1" font-size="18">Propulsion is added only after sensing, safety-state logic, and observability are reliable enough that new failures can be isolated and diagnosed.</text></g></svg>