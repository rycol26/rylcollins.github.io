<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760"><rect width="1440" height="760" fill="#091619"/><g font-family="Arial,Helvetica,sans-serif"><text x="68" y="62" fill="#edf3f1" font-size="34" font-weight="700">2026 AEAC system architecture</text><text x="68" y="101" fill="#9fb6b5" font-size="18">The competition did not require multiple aircraft. The team deliberately chose a mothership architecture.</text><text x="68" y="170" fill="#8bc7d2" font-size="13" font-weight="700" letter-spacing="2">ARCHITECTURAL DECISION</text><rect x="68" y="195" width="370" height="112" fill="#102429" stroke="#315159" stroke-width="2"/><text x="92" y="234" fill="#edf3f1" font-size="22" font-weight="700">Competition mission</text><text x="92" y="268" fill="#b9c8c5" font-size="17">Urban firefighting</text><path d="M438 251 H545" stroke="#557780" stroke-width="3"/><polygon points="545,251 529,242 529,260" fill="#557780"/><rect x="545" y="195" width="370" height="112" fill="#102429" stroke="#82c7c0" stroke-width="2"/><text x="569" y="234" fill="#edf3f1" font-size="22" font-weight="700">Chosen architecture</text><text x="569" y="268" fill="#82c7c0" font-size="18">Mothership / cooperating aircraft roles</text><path d="M915 251 H1022" stroke="#557780" stroke-width="3"/><polygon points="1022,251 1006,242 1006,260" fill="#557780"/><rect x="1022" y="195" width="350" height="112" fill="#102429" stroke="#c8a46c" stroke-width="2"/><text x="1046" y="234" fill="#edf3f1" font-size="22" font-weight="700">Competition result</text><text x="1046" y="268" fill="#c8a46c" font-size="18">2026 AEAC Innovation Award · 6th overall</text><text x="68" y="385" fill="#8bc7d2" font-size="13" font-weight="700" letter-spacing="2">ELECTRICAL SYSTEM BOUNDARIES</text><rect x="68" y="415" width="270" height="170" fill="#102429" stroke="#315159" stroke-width="2"/><text x="92" y="452" fill="#edf3f1" font-size="19" font-weight="700">Sensing</text><text x="92" y="490" fill="#b9c8c5" font-size="16">2D LiDAR</text><text x="92" y="518" fill="#b9c8c5" font-size="16">RTK GNSS · IMU</text><text x="92" y="546" fill="#b9c8c5" font-size="16">Cameras</text><rect x="390" y="415" width="270" height="170" fill="#102429" stroke="#315159" stroke-width="2"/><text x="414" y="452" fill="#edf3f1" font-size="19" font-weight="700">Compute</text><text x="414" y="490" fill="#b9c8c5" font-size="16">Flight computer</text><text x="414" y="518" fill="#b9c8c5" font-size="16">Autonomy compute</text><text x="414" y="546" fill="#b9c8c5" font-size="16">Navigation · vision</text><rect x="712" y="415" width="270" height="170" fill="#102429" stroke="#315159" stroke-width="2"/><text x="736" y="452" fill="#edf3f1" font-size="19" font-weight="700">Power</text><text x="736" y="490" fill="#b9c8c5" font-size="16">Protected distribution</text><text x="736" y="518" fill="#b9c8c5" font-size="16">E-fuses · inrush limiting</text><text x="736" y="546" fill="#b9c8c5" font-size="16">50 V → 5 V converter</text><rect x="1034" y="415" width="338" height="170" fill="#102429" stroke="#315159" stroke-width="2"/><text x="1058" y="452" fill="#edf3f1" font-size="19" font-weight="700">Communications / interfaces</text><text x="1058" y="490" fill="#b9c8c5" font-size="16">CAN bus · Ethernet · LTE</text><text x="1058" y="518" fill="#b9c8c5" font-size="16">Electrical ↔ autonomy</text><text x="1058" y="546" fill="#b9c8c5" font-size="16">Electrical ↔ mechanical</text><path d="M338 500 H390 M660 500 H712 M982 500 H1034" stroke="#557780" stroke-width="3"/><text x="68" y="655" fill="#8bc7d2" font-size="13" font-weight="700" letter-spacing="2">DESIGN INTENT</text><text x="68" y="690" fill="#edf3f1" font-size="18">Make the interfaces created by the mothership architecture explicit enough to design, review, test, and integrate independently.</text></g></svg>